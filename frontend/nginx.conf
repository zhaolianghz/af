server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — let React Router handle client-side routes.
  location / {
    try_files $uri /index.html;
  }

  # API proxy — the SPA calls a relative /api/v1 base (same-origin), so
  # in the Docker stack nginx forwards /api/* to the backend container.
  # `app` is the compose service name; 8080 its port. Without this every
  # API call would hit the SPA fallback and return index.html.
  location /api/ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (run event stream) needs buffering off + long read timeout.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Long-term caching for hashed Vite assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Don't cache the SPA shell.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
