name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Version-consistency gate: every job below requires this. Fails fast
  # if backend/go.mod and frontend/package.json disagree with the
  # versions pinned in this workflow. Cheaper than waiting for backend
  # to fail at "go mod tidy" on the wrong Go version.
  # ---------------------------------------------------------------------------
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    env:
      PINNED_GO: "1.25"
      PINNED_NODE: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify go.mod matches workflow pin
        run: |
          # "go 1.25.0" -> "1.25"
          WANT=$(grep -E '^go ' backend/go.mod | awk '{print $2}' | cut -d. -f1,2)
          echo "go.mod=$WANT, workflow pins $PINNED_GO"
          if [ "$WANT" != "$PINNED_GO" ]; then
            echo "::error::backend/go.mod requires Go $WANT but this workflow pins $PINNED_GO — update both together"
            exit 1
          fi
      - name: Verify package.json engines matches workflow pin
        working-directory: frontend
        run: |
          # ">=20" -> "20"
          WANT=$(node -p "(require('./package.json').engines?.node ?? '').replace(/[^0-9.]/g,'').split('.')[0]")
          echo "package.json engines.node=$WANT, workflow pins $PINNED_NODE"
          if [ "$WANT" != "$PINNED_NODE" ]; then
            echo "::error::frontend/package.json engines.node ($WANT) disagrees with workflow Node $PINNED_NODE — update both together"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Backend: Go 1.25 with -race. Single version (matches go.mod).
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go 1.25)
    runs-on: ubuntu-latest
    needs: [version-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Go mod tidy
        working-directory: backend
        run: go mod tidy

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Go build
        working-directory: backend
        run: go build ./...

      - name: Go test (with -race)
        working-directory: backend
        run: go test ./... -count=1 -race -timeout 120s

  # ---------------------------------------------------------------------------
  # Frontend: typecheck + lint + build + vitest + playwright e2e.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      # Cache the Playwright browser binary between runs.
      # Keyed on the package-lock hash so a Playwright version
      # bump invalidates automatically.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: E2E smoke tests (Playwright)
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Nightly: run the heavy stuff (coverage) on a schedule so PR checks
  # stay fast. Currently disabled — see comment at the bottom for how
  # to enable the schedule.
  # ---------------------------------------------------------------------------
  nightly:
    name: Nightly (race + coverage)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Race tests + coverage
        working-directory: backend
        run: |
          mkdir -p ../coverage
          go test ./... -count=1 -race -coverprofile=../coverage/coverage.out -timeout 300s
          go tool cover -func=../coverage/coverage.out | tail -1

# Nightly schedule is commented out by default to keep Actions usage low;
# uncomment + add the workflow file to the schedules UI to enable.
#
# on:
#   schedule:
#     - cron: "0 3 * * *"
